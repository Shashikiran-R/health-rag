<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dietary Guidance AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-panel header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <h1>Dietary Guidance AI</h1>
            </div>
            <p class="subtitle">Evidence-based RAG Chatbot</p>
        </header>

        <main class="chat-container glass-panel">
            <div id="chat-messages" class="chat-messages">
                <div class="message bot-message">
                    <div class="avatar">AI</div>
                    <div class="content">
                        Hello! I am your dietary guidance assistant. I can answer questions about food safety and dietary guidelines based on our corpus of 7 documents. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator hidden" id="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <form id="chat-form" class="chat-input-area">
                <input type="text" id="user-input" placeholder="Ask about food safety or dietary guidelines..." required autocomplete="off">
                <button type="submit" id="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
